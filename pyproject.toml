[project]
name = "ztrag"
version = "0.1.0"
description = "Zero-trust RAG: document-level authorization enforced at query time"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
real-embeddings = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
